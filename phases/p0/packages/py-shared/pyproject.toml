[tool.poetry]
name = "py-shared"
version = "0.1.0"
description = "Shared Python models and utilities"
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.10"
sqlalchemy = "^2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]