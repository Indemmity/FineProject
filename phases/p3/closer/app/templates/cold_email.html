<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; background-color: #ffffff; }
    .header { border-bottom: 2px solid #2563eb; padding-bottom: 16px; margin-bottom: 24px; }
    .header h1 { font-size: 18px; color: #1a1a1a; margin: 0; }
    .body-text { font-size: 15px; line-height: 1.6; color: #333; }
    .cta-button { display: inline-block; padding: 12px 24px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; margin: 16px 0; font-weight: 500; }
    .cta-button:hover { background-color: #1d4ed8; }
    .signature { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 14px; color: #666; }
    .footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #999; text-align: center; }
    @media only screen and (max-width: 480px) { .container { padding: 12px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Opportunity at {{ company }}</h1>
    </div>
    <div class="body-text">
      <p>Hi {{ recipient_name }},</p>
      <p>{{ intro_paragraph }}</p>
      <p>{{ body_paragraph }}</p>
      <p>{{ closing_paragraph }}</p>
    </div>
    <div class="signature">
      <p><strong>{{ sender_name }}</strong></p>
      <p>{{ sender_title }}</p>
    </div>
    <div class="footer">
      <p>You're receiving this because your profile matches opportunities at {{ company }}.</p>
      <p>To unsubscribe from future emails, <a href="{{ unsubscribe_url }}" style="color: #666;">click here</a>.</p>
    </div>
  </div>
</body>
</html>
